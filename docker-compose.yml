services:
  postgres:
    image: postgres:16-alpine
    container_name: tenantkit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tenantkit
      POSTGRES_PASSWORD: tenantkit_password
      POSTGRES_DB: tenantkit
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tenantkit -d tenantkit']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tenantkit-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tenantkit-api
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://tenantkit_app:tenantkit_app_password@postgres:5432/tenantkit
      DATABASE_ADMIN_URL: postgresql://tenantkit:tenantkit_password@postgres:5432/tenantkit
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
